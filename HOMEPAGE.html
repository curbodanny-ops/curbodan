<!DOCTYPE><html >
<head>
    
    <title>this is our Home page</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: Arial, sans-serif;
      background-image: url("phone (1).png");
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      background-attachment: fixed;
      color: white;
    }
        .home {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 30px;
            padding-bottom: 110px;
        }

        .content {
            max-width: 750px;
            padding: 50px 40px;
            background: rgba(255, 255, 255, 0.10);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 25px;
            backdrop-filter: blur(12px);
            box-shadow: 0 10px 40px rgba(0,0,0,0.3);
        }

        .content h1 {
            font-size: 55px;
            margin-bottom: 20px;
        }

        .content p {
            font-size: 18px;
            line-height: 1.7;
            color:white;
            margin-bottom: 30px;
        }

        .bottom-nav {
            position: fixed;
            bottom: 15px;
            left: 50%;
            transform: translateX(-50%);
            width: 95%;
            max-width: 850px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
            padding: 12px;
            background: rgba(0, 0, 0, 0.65);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 20px;
            backdrop-filter: blur(15px);
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.4);
            z-index: 1000;
        }

        .bottom-nav a {
            text-decoration: none;
            color:white;
            padding: 12px 18px;
            border-radius: 12px;
            background: transparent;
            cursor: pointer;
            font-size: 14px;
            transition: 0.3s;
        }

        .bottom-nav a:hover {
            background: #00d9ff;
            color: black;
        }

       

        @media (max-width: 600px) {
            .bottom-nav {
                bottom: 10px;
                width: 96%;
                padding: 8px 5px;
                gap: 3px;
                border-radius: 18px;
            }

            .bottom-nav a {
                padding: 10px 7px;
                font-size: 11px;
            }

            .content {
                padding: 35px 20px;
            }

            .content h1 {
                font-size: 35px;
            }

            .content p {
                font-size: 15px;
            }
        }
    </style>
</head>

<body>

    <section class="HOMEPAGE">
        <div class="content">
            <h1>
                Welcome to <span>My Website</span>
            </h1>

            <p>
                Welcome to our website! Explore our products,
                learn more about us, contact us, and enjoy our
                available films. Everything you need is organized
                in one simple and easy-to-use website.
            </p>
        </div>
    </section>

    <nav class="bottom-nav">
        <a href="HOMEPAGE.html">HOMEPAGE</a>
        <a href="ABOUT.html">ABOUT</a>
        <a href="PRODUCT.html">Product</a>
        <a href="CONTACT.html">Contact</a>
        <a href="film.html">Film Viewing</a>
        <a href="INDEX.html" class="logout">Logout</a>
    </nav>

</body>
</html>
