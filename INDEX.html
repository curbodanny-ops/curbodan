
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login | DANS CLOTHING</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #050505;
            color: white;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        header {
            background: #000;
            color: white;
            padding: 22px 15px;
            text-align: center;
            border-bottom: 3px solid #444;
        }

        header h1 {
            font-size: clamp(22px, 4vw, 36px);
            letter-spacing: 3px;
            font-weight: 900;
        }

        main {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 35px 15px;
            background:
                linear-gradient(#000000cc, #000000cc),
                repeating-linear-gradient(
                    45deg,
                    #161616 0px,
                    #161616 20px,
                    #080808 20px,
                    #080808 40px
                );
        }

        .login-box {
            width: 100%;
            max-width: 400px;
            background: #111;
            padding: 35px 28px;
            border: 2px solid #333;
            border-top: 5px solid #fff;
            border-radius: 4px;
            box-shadow: 0 10px 35px #000;
        }

        .logo {
            text-align: center;
            font-size: 65px;
            margin-bottom: 5px;
        }

        h2 {
            color: white;
            text-align: center;
            margin: 10px 0;
            font-size: clamp(24px, 4vw, 30px);
            letter-spacing: 3px;
        }

        .subtitle {
            color: #aaa;
            text-align: center;
            margin-bottom: 25px;
            font-size: 14px;
        }

        label {
            display: block;
            color: #eee;
            font-weight: bold;
            margin: 15px 0 7px;
        }

        input {
            display: block;
            width: 100%;
            min-width: 0;
            padding: 13px;
            background: #080808;
            color: white;
            border: 1px solid #444;
            border-radius: 3px;
            font-size: 16px;
        }

        input::placeholder {
            color: #888;
        }

        input:focus {
            outline: 2px solid white;
            border-color: white;
        }

        .login-button {
            width: 100%;
            padding: 14px;
            margin-top: 22px;
            background: white;
            color: black;
            border: 2px solid white;
            border-radius: 3px;
            font-size: 16px;
            font-weight: 900;
            letter-spacing: 2px;
            cursor: pointer;
            transition: 0.3s;
        }

        .login-button:hover {
            background: #333;
            color: white;
        }

        .links {
            text-align: center;
            margin-top: 20px;
            line-height: 2;
            color: #ccc;
        }

        .links a {
            color: white;
            text-decoration: none;
            font-weight: bold;
        }

        .links a:hover {
            color: #aaa;
            text-decoration: underline;
        }

        #message {
            color: #ff5252;
            text-align: center;
            margin-top: 15px;
            font-size: 14px;
        }

        footer {
            background: #000;
            color: #aaa;
            text-align: center;
            padding: 18px;
            border-top: 2px solid #333;
            font-size: 13px;
        }

        @media (max-width: 600px) {
            .login-box {
                padding: 25px 18px;
            }

            header h1 {
                letter-spacing: 2px;
            }
        }
    </style>
</head>

<body>

    <header>
        <h1>&#128085; DANS CLOTHING</h1>
    </header>

    <main>
        <section class="login-box">

            <div class="logo">&#128085;</div>

            <h2>WELCOME</h2>
            <p class="subtitle">SIGN IN TO YOUR STYLE</p>

            <form onsubmit="return checkLogin()">

                <label for="username">Username or Email</label>
                <input
                    type="text"
                    id="username"
                    name="username"
                    placeholder="Enter your username"
                    autocomplete="username"
                    required
                >

                <label for="password">Password</label>
                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Enter your password"
                    autocomplete="current-password"
                    required
                >

                <button type="submit" class="login-button">
                    LOGIN
                </button>

                <p id="message" role="alert"></p>

            </form>

            <div class="links">
                <a href="contact.html">Forgot Password?</a>

                <p>Don't have an account?</p>

                <a href="home.html">Continue as Guest</a>
            </div>

        </section>
    </main>

    <footer>
        <p>&copy; 2026 DANS CLOTHING. All Rights Reserved.</p>
    </footer>

    <script>
        function checkLogin() {
            const username =
                document.getElementById("username").value.trim();

            const password =
                document.getElementById("password").value;

            const message =
                document.getElementById("message");

            if (username === "DANNY" && password === "CURBO") {
                window.location.href = "HOMEPAGE.html";
            } else {
                message.textContent =
                    "Wrong username or password! Please try again.";
            }

            return false;
        }
    </script>

</body>
</html>
